<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Landing Pages · Marco Padilla</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--txt:#e2e8f0;--mut:#94a3b8;--acc:#38bdf8}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:56px 16px 24px;text-align:center}h1{margin:0 0 8px;font-size:2rem}p{color:var(--mut);margin:0}
main{max-width:1000px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
a.card{display:block;padding:24px;border-radius:14px;background:var(--card);color:inherit;text-decoration:none;border:1px solid #334155;transition:transform .15s,border-color .15s}
a.card:hover{transform:translateY(-3px);border-color:var(--acc)}a.card h2{margin:0 0 6px;font-size:1.15rem}a.card span{color:var(--acc);font-size:.85rem}
footer{text-align:center;color:var(--mut);padding:32px 16px;font-size:.85rem}
</style>
</head>
<body>
<header><h1>Landing Pages</h1><p>Landing pages responsivas de turismo · Marco Adrián Padilla Triviño</p></header>
<main>
<a class="card" href="wild-camp/"><h2>Wild Camp</h2><p>Camping y aventura</p><span>Ver sitio →</span></a>
<a class="card" href="ocean-breeze/"><h2>Ocean Breeze Resort</h2><p>Resort de playa</p><span>Ver sitio →</span></a>
</main>
<footer><a href="https://github.com/Adrizzx" style="color:var(--acc)">github.com/Adrizzx</a></footer>
</body>
</html>
